name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Create D1 and R2 if missing, then point the config at the real D1 id
        run: |
          npx wrangler r2 bucket create cloud-files || true
          npx wrangler d1 create cloud || true
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).find(d=>d.name==="cloud").uuid))')
          sed -i "s/REPLACE_DB_ID/$ID/" wrangler.jsonc
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy --var ADMIN_EMAIL:${{ secrets.ADMIN_EMAIL }}
